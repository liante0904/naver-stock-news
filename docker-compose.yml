services:
  news-bot:
    profiles: ["fallback"]
    image: ghcr.io/liante0904/naver-stock-news:latest
    container_name: naver-stock-news-bot
    user: "1001:1001"
    restart: "no"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ~/sqlite3:/app/db
      - ~/logs:/app/log
      - ./app.py:/app/app.py
